[tool.poetry]
name = "TibiaPilotNG"
version = "0.1.0"
description = ""
authors = ["Paulo Lacerda <paulorl2810@gmail.com>", "lucasmonstro <joao.galiano.silva@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
cityhash = ">=0.4.10"
mypy = "^1.1.1"
nptyping = "^2.5.0"
numba = ">=0.60.0"
numpy = ">=1.26.0,<2.0.0"
opencv-python = "^4.6.0.66"
pillow = ">=10.0.0"
pyautogui = "^0.9.53"
python = ">=3.11,<3.13"
scipy = ">=1.9.1"
tcod = "^13.8.1"
tinydb = "^4.8.0"
customtkinter = "^5.2.2"
requests = "^2.31.0"
scikit-image = "^0.22.0"
pytesseract = "^0.3.10"
pynput = "^1.7.7"
mss = "^9.0.1"
python-xlib = {version = "^0.33", markers = "sys_platform == 'linux'"}
pygetwindow = {version = "^0.0.9", markers = "sys_platform == 'win32'"}
pywin32 = {version = "^306", markers = "sys_platform == 'win32'"}
pyserial = {version = "^3.5", markers = "sys_platform == 'win32'"}
dxcam = {git = "https://github.com/paulordyl/DXcam", markers = "sys_platform == 'win32'"}

[tool.poetry.group.test.dependencies]
pytest = "^7.1.3"
pytest-mock = "^3.8.2"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^5.12.0"
taskipy = "^1.10.3"

[tool.taskipy.tasks]
test = "python -m pytest ."

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"